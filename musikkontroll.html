<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Musikkontroll</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="data:application/manifest+json,{
    \"name\":\"Musikkontroll\",\"short_name\":\"Kontroll\",\"start_url\":\".\",
    \"display\":\"standalone\",\"background_color\":\"#0f172a\",\"theme_color\":\"#0f172a\"
  }">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    :root { --p:#0f172a; --g:#10b981; --a:#f59e0b; }
    body{font-family:-apple-system,sans-serif;margin:0;background:#f8fafc;color:#1e293b;padding-bottom:90px}
    header{background:var(--p);color:white;padding:16px;text-align:center;font-size:20px;font-weight:700}
    nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:2px solid #e2e8f0;display:flex;z-index:10}
    nav button{flex:1;padding:16px;background:none;font-weight:600;color:var(--p);border:none}
    nav button.active{background:var(--p);color:white}
    .page{display:none;padding:16px;max-width:640px;margin:0 auto}
    .page.active{display:block}
    .card{background:white;padding:12px;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,.08);margin-bottom:12px}
    label{font-weight:600;color:#334155;margin:8px 0 4px;display:block}
    input,select,textarea{width:100%;padding:12px;border:2px solid #e2e8f0;border-radius:12px;font-size:16px;box-sizing:border-box}
    button{background:var(--p);color:white;border:none;padding:14px;border-radius:12px;font-size:16px;font-weight:600;margin:6px 0}
    .btn-s{background:#6366f1;padding:14px 20px;font-size:15px;width:auto}
    .btn-g{background:var(--g)}
    .btn-a{background:var(--a)}
    .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}
    .row>*{flex:1;min-width:80px}
    .row button{width:40px;height:40px;font-size:20px;background:#e2e8f0;color:var(--p)}
    .log{font-size:13px;color:var(--g);margin-top:4px;padding:8px;background:#f0fdf4;border-radius:8px}
    .radio{display:flex;gap:30px;margin:8px 0}
    .radio label{font-weight:normal;font-size:18px}
    table{width:100%;border-collapse:separate;border-spacing:0 4px}
    th{background:#f1f5f9;padding:8px;text-align:left;font-weight:600;cursor:pointer;font-size:14px}
    td{background:white;padding:8px;font-size:14px}
    td button{background:#3b82f6;color:white;padding:4px 8px;border-radius:8px;font-size:12px}
  </style>
</head>
<body>

<header>🎵 Musikkontroll</header>

<div id="kontroll" class="page active">
  <div class="card">
    <label>Org.nr</label>
    <div class="row">
      <input id="orgnr" maxlength="9" placeholder="123456789">
      <button class="btn-s" onclick="searchBrreg()">SØK</button>
    </div>
    <div class="log" id="brreg-log"></div>
  </div>

  <div class="card"><label>Besøksnavn</label><input id="navn"></div>
  <div class="card"><label>Besøksadresse</label><input id="besoksadresse"></div>
  <div class="card">
    <label>Besøks post</label>
    <div class="row">
      <input id="besoks_postnr" type="number" placeholder="0000">
      <input id="besoks_poststed" placeholder="Oslo">
    </div>
  </div>

  <div class="card"><label>Juridisk navn</label><input id="firma"></div>
  <div class="card"><label>Postadresse</label><input id="postadresse"></div>
  <div class="card">
    <label>Post post</label>
    <div class="row">
      <input id="post_postnr" type="number" placeholder="0000">
      <input id="post_poststed" placeholder="Oslo">
    </div>
  </div>

  <div class="card"><label>Bransje</label><input id="bransje" disabled></div>
  <div class="card">
    <label>Type sted</label>
    <select id="type" onchange="updateTariffDefault()">
      <option>Serveringssted</option>
      <option>Kundelokale</option>
    </select>
  </div>

  <div class="card">
    <label>Spiller musikk?</label>
    <div class="radio">
      <label><input type="radio" name="musikk" value="ja" checked onchange="toggleMusikk()"> JA</label>
      <label><input type="radio" name="musikk" value="nei" onchange="toggleMusikk()"> NEI</label>
    </div>
    <p id="musikk-tekst" style="color:green;font-weight:600;">Spiller musikk</p>

    <div id="tariff-section">
      <strong>Tariff-linjer</strong>
      <div id="tariff-rows"></div>
      <button type="button" onclick="addRow()" class="btn-s" style="margin-top:8px;">+ Ny linje</button>
    </div>
  </div>

  <div class="card"><label>Høyttalere</label><input id="hoyttalere"></div>
  <div class="card"><label>Kommentar</label><textarea id="kommentar" rows="3"></textarea></div>

  <div class="card">
    <button onclick="save('draft')">💾 Lagre</button>
    <button class="btn-a" onclick="printReceipt()">🖨 Print</button>
    <button class="btn-g" onclick="save('sent')">📧 Send PDF</button>
  </div>
</div>

<div id="lister" class="page">
  <div class="card">
    <label>Import Excel</label>
    <input type="file" id="excelFile" accept=".xlsx,.xls" onchange="importExcel(event)">
    <div id="import-status" class="log hidden"></div>
  </div>
  <div id="list-table"></div>
</div>

<div id="kontrollert" class="page">
  <div id="archive"></div>
</div>

<nav>
  <button class="active" onclick="show('kontroll')">Skjema</button>
  <button onclick="show('lister')">Lister</button>
  <button onclick="show('kontrollert')">Ferdig</button>
</nav>

<script>
  const s = localStorage;
  let lists = JSON.parse(s.getItem('lists')||'[]');
  let controls = JSON.parse(s.getItem('controls')||'[]');
  let rowId = 0;

  const defaults = {
    Serveringssted: {kvm:'',seats:'',days:'356',type:'Bakgrunnsmusikk'},
    Kundelokale: {kvm:'',days:'310',type:'Bakgrunnsmusikk'}
  };

  function show(p){
    document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));
    document.getElementById(p).classList.add('active');
    document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
    event.target.classList.add('active');
    if(p==='lister')renderLists();
    if(p==='kontrollert')renderArchive();
  }

  function clearForm(){
    ['navn','besoksadresse','besoks_postnr','besoks_poststed','firma','postadresse','post_postnr','post_poststed','bransje'].forEach(id=>document.getElementById(id).value='');
    document.getElementById('tariff-rows').innerHTML='';addRow();
  }

  async function searchBrreg(){
    let n=document.getElementById('orgnr').value.replace(/\D/g,'');
    if(n.length!==9){document.getElementById('brreg-log').innerHTML='⚠️ 9 siffer';return;}
    clearForm();
    document.getElementById('brreg-log').innerHTML='🔍 Søker...';
    try{
      const r=await fetch(`https://data.brreg.no/enhetsregisteret/api/enheter/${n}`);
      if(!r.ok)throw '';
      const d=await r.json();
      const a=d.forretningsadresse||d.beliggenhetsadresse||{};
      const p=d.postadresse||{};
      document.getElementById('navn').value=d.navn||'';
      document.getElementById('firma').value=d.navn||'';
      document.getElementById('besoksadresse').value=a.adresse?a.adresse.join(', '):'';
      document.getElementById('besoks_postnr').value=a.postnummer||'';
      document.getElementById('besoks_poststed').value=a.poststed||'';
      document.getElementById('postadresse').value=p.adresse?p.adresse.join(', '):'';
      document.getElementById('post_postnr').value=p.postnummer||'';
      document.getElementById('post_poststed').value=p.poststed||'';
      document.getElementById('bransje').value=d.naeringskode1?.beskrivelse||'';
      const k=(d.naeringskode1?.kode||'').slice(0,2);
      const t= k==='56'?'Serveringssted':(k==='47'||k==='96'?'Kundelokale':'Serveringssted');
      document.getElementById('type').value=t;
      document.getElementById('brreg-log').innerHTML='✅ Hentet!';
      updateTariffDefault();
    }catch{e}{
      document.getElementById('brreg-log').innerHTML='❌ Ikke funnet – fyll manuelt';
    }
  }

  function updateTariffDefault(){
    if(document.getElementById('tariff-rows').children.length===0)addRow();
  }

  function toggleMusikk(){
    const ja=document.querySelector('[name=musikk]:checked').value==='ja';
    document.getElementById('musikk-tekst').style.display=ja?'block':'none';
    document.getElementById('tariff-section').style.display=ja?'block':'none';
  }

  function addRow(data=null){
    const t=document.getElementById('type').value;
    const d=data||defaults[t];
    const s=t==='Serveringssted';
    const r=document.createElement('div'); r.className='row'; r.id='row-'+(rowId++);
    r.innerHTML=`
      <input type="number" placeholder="kvm" value="${d.kvm||''}">
      ${s?`<input type="number" placeholder="seter" value="${d.seats||''}">`:''}
      <input type="number" placeholder="dager" value="${d.days||''}">
      <select><option ${d.type==='Bakgrunnsmusikk'?'selected':''}>Bakgrunnsmusikk</option><option ${d.type==='Fremtredende'?'selected':''}>Fremtredende</option></select>
      <button onclick="this.parentElement.remove()">−</button>
      <button onclick="addRow(copyRow(this.parentElement))">+</button>
    `;
    document.getElementById('tariff-rows').appendChild(r);
  }

  function copyRow(row){
    const i=row.querySelectorAll('input,select');
    const s=document.getElementById('type').value==='Serveringssted';
    return {kvm:i[0].value,seats:s?i[1].value:'',days:s?i[2].value:i[1].value,type:i[s?3:2].value};
  }

  function getFormData(){
    const rows=[];
    document.querySelectorAll('#tariff-rows .row').forEach(r=>{
      const i=r.querySelectorAll('input,select');
      const s=document.getElementById('type').value==='Serveringssted';
      rows.push({kvm:i[0].value,seats:s?i[1].value:'',days:s?i[2].value:i[1].value,type:i[s?3:2].value});
    });
    return {
      orgnr:document.getElementById('orgnr').value,
      navn:document.getElementById('navn').value,
      besoksadresse:document.getElementById('besoksadresse').value,
      besoks_postnr:document.getElementById('besoks_postnr').value,
      besoks_poststed:document.getElementById('besoks_poststed').value,
      firma:document.getElementById('firma').value,
      postadresse:document.getElementById('postadresse').value,
      post_postnr:document.getElementById('post_postnr').value,
      post_poststed:document.getElementById('post_poststed').value,
      bransje:document.getElementById('bransje').value,
      type:document.getElementById('type').value,
      musikk:document.querySelector('[name=musikk]:checked').value,
      tariff:rows,
      hoyttalere:document.getElementById('hoyttalere').value,
      kommentar:document.getElementById('kommentar').value,
      dato:new Date().toISOString()
    };
  }

  function save(status){
    const d=getFormData(); d.status=status;
    controls.push(d); s.setItem('controls',JSON.stringify(controls));
    alert(status==='sent'?'PDF lastet ned!':'Lagret!');
    if(status==='sent')generatePDF(d);
    renderArchive(); show('kontrollert');
  }

  function generatePDF(d){
    const {jsPDF}=window.jspdf; const doc=new jsPDF();
    let y=20;
    doc.setFontSize(16); doc.text('Musikkontroll',105,y,{align:'center'}); y+=12;
    doc.setFontSize(11);
    doc.text(`Dato: ${new Date(d.dato).toLocaleString('nb-NO')}`,20,y); y+=7;
    doc.text(`Org.nr: ${d.orgnr}`,20,y); y+=7;
    doc.text(`Sted: ${d.navn}`,20,y); y+=7;
    doc.text(`Adresse: ${d.besoksadresse}, ${d.besoks_postnr} ${d.besoks_poststed}`,20,y); y+=7;
    doc.text(`Firma: ${d.firma}`,20,y); y+=7;
    doc.text(`Post: ${d.postadresse}, ${d.post_postnr} ${d.post_poststed}`,20,y); y+=7;
    doc.text(`Bransje: ${d.bransje}`,20,y); y+=7;
    doc.text(`Type: ${d.type}`,20,y); y+=7;
    doc.text(`Musikk: ${d.musikk.toUpperCase()}`,20,y); y+=7;
    d.tariff.forEach((t,i)=>{doc.text(`${i+1}. ${t.type}: ${t.kvm}kvm • ${t.seats||'-'}seter • ${t.days}d`,25,y); y+=7;});
    doc.text(`Høyttalere: ${d.hoyttalere}`,20,y); y+=7;
    doc.text(`Kommentar: ${d.kommentar}`,20,y);
    const a=document.createElement('a'); a.href=URL.createObjectURL(doc.output('blob'));
    a.download=`kontroll-${d.orgnr}.pdf`; a.click();
  }

  function printReceipt(){
    const d=getFormData();
    const w=window.open(); w.document.write(`
      <style>body{font:14px sans-serif;text-align:center;padding:20px}</style>
      <h2>KONTROLLSKJEMA</h2>
      <p><b>${new Date(d.dato).toLocaleString('nb-NO')}</b></p>
      <p>Org.nr: <b>${d.orgnr}</b></p>
      <p>${d.navn}</p>
      <p>${d.besoksadresse}, ${d.besoks_postnr} ${d.besoks_poststed}</p>
      <p>Firma: ${d.firma}</p>
      <p>Musikk: ${d.musikk.toUpperCase()}</p>
      ${d.tariff.map(t=>`<p>${t.type}: ${t.kvm}kvm / ${t.seats||''}seter / ${t.days}d</p>`).join('')}
      <p>Høyttalere: ${d.hoyttalere}</p>
      <p>Kommentar: ${d.kommentar}</p>
    `); w.print();
  }

  function importExcel(e){
    const f=e.target.files[0]; const r=new FileReader();
    r.onload=ev=>{
      const wb=XLSX.read(ev.target.result,{type:'array'});
      lists=[];
      wb.SheetNames.forEach(n=>{
        const json=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1});
        const h=json[0].map(x=>x?.toString().trim());
        json.slice(1).forEach(row=>{
          let o={}; h.forEach((k,i)=>{if(k)o[k]=row[i]?.toString().trim()||''});
          if(o.Orgnummer||o['Org.nr']||o.Org)lists.push(o);
        });
      });
      s.setItem('lists',JSON.stringify(lists));
      document.getElementById('import-status').textContent=`Importert ${lists.length} rader!`;
      document.getElementById('import-status').classList.remove('hidden');
      renderLists();
    };
    r.readAsArrayBuffer(f);
  }

  function renderLists(){
    const t=document.getElementById('list-table');
    t.innerHTML='<table><thead><tr><th>Org.nr</th><th>Navn</th><th>Adresse</th><th>Post</th><th>Sted</th><th>Bransje</th><th></th></tr></thead><tbody></tbody></table>';
    const b=t.querySelector('tbody');
    lists.forEach((i,idx)=>{
      const tr=document.createElement('tr');
      tr.innerHTML=`<td>${i.Orgnummer||''}</td><td>${i.Navn||''}</td><td>${i.Besøksadresse||''}</td><td>${i.Postnr||''}</td><td>${i.Poststed||''}</td><td>${i.Bransje||''}</td>
        <td><button onclick="loadFromList(${idx})">Start</button></td>`;
      b.appendChild(tr);
    });
  }

  function loadFromList(i){
    const x=lists[i];
    document.getElementById('orgnr').value=x.Orgnummer||x['Org.nr']||'';
    searchBrreg();
    show('kontroll');
  }

  function renderArchive(){
    const d=document.getElementById('archive'); d.innerHTML='';
    const m={}; controls.forEach(c=>{
      const k=new Date(c.dato).toLocaleDateString('nb-NO',{year:'numeric',month:'long'});
      m[k]=m[k]||[]; m[k].push(c);
    });
    Object.keys(m).sort().reverse().forEach(k=>{
      const e=document.createElement('div'); e.className='month'; e.textContent=k;
      m[k].forEach(c=>{
        const li=document.createElement('div');
        li.style='background:white;padding:12px;margin:8px 0;border-radius:12px';
        li.innerHTML=`<b>${c.navn}</b> – ${new Date(c.dato).toLocaleDateString('nb-NO')}<br>
          ${c.tariff.map(t=>`${t.kvm}kvm • ${t.seats}seter • ${t.days}d • ${t.type}`).join('<br>')}
          <button onclick="editControl('${c.dato}')" style="float:right;background:#f97316;color:white;padding:6px 10px;border-radius:8px">Rediger</button>`;
        e.appendChild(li);
      });
      d.appendChild(e);
    });
  }

  window.editControl=function(date){
    const c=controls.find(x=>x.dato===date);
    document.getElementById('orgnr').value=c.orgnr;
    searchBrreg();
    setTimeout(()=>{
      document.getElementById('navn').value=c.navn;
      document.getElementById('besoksadresse').value=c.besoksadresse;
      document.getElementById('besoks_postnr').value=c.besoks_postnr;
      document.getElementById('besoks_poststed').value=c.besoks_poststed;
      document.getElementById('firma').value=c.firma;
      document.getElementById('postadresse').value=c.postadresse;
      document.getElementById('post_postnr').value=c.post_postnr;
      document.getElementById('post_poststed').value=c.post_poststed;
      document.getElementById('bransje').value=c.bransje;
      document.getElementById('type').value=c.type;
      document.querySelector(`[name=musikk][value=${c.musikk}]`).checked=true;
      toggleMusikk();
      document.getElementById('hoyttalere').value=c.hoyttalere;
      document.getElementById('kommentar').value=c.kommentar;
      document.getElementById('tariff-rows').innerHTML='';
      c.tariff.forEach(t=>addRow(t));
    },500);
    show('kontroll');
  };

  // INIT
  addRow(); renderLists(); renderArchive();
</script>
</body>
</html>
