<!DOCTYPE html><html lang="no"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Musikkontroll</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  :root{--p:#0f172a;--g:#10b981;--a:#f59e0b;--gray:#f1f5f9}
  body{font:-apple-system,sans-serif;margin:0;background:#f8fafc;color:#1e293b}
  header{background:var(--p);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:10;box-shadow:0 2px 10px rgba(0,0,0,.1)}
  nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e2e8f0;display:flex;z-index:20}
  nav button{flex:1;padding:14px;font-weight:600;color:var(--p);background:none;border:none}
  nav button.active{background:var(--p);color:#fff}
  .page{display:none;padding:16px 16px 80px;max-width:640px;margin:auto}
  .page.active{display:block}
  .card{background:#fff;padding:14px;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.08);margin-bottom:12px}
  label{display:block;font-weight:600;margin:8px 0 4px;color:#334155}
  input,select,textarea{width:100%;padding:11px;border:2px solid #e2e8f0;border-radius:10px;font-size:16px;box-sizing:border-box}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  .row>*{flex:1;min-width:80px}
  button.btn{padding:12px;border-radius:10px;font-weight:600;width:100%;margin:6px 0}
  .btn-p{background:var(--p);color:#fff}
  .btn-g{background:var(--g);color:#fff}
  .btn-a{background:var(--a);color:#fff}
  .log{font-size:13px;color:var(--g);background:#f0fdf4;padding:8px;border-radius:8px;margin-top:4px}
  .fixed-bottom{position:fixed;bottom:70px;left:16px;right:16px;background:#fff;padding:12px;border-radius:12px;box-shadow:0 -2px 12px rgba(0,0,0,.1);z-index:15}
  .list-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .list-meta{font-size:12px;color:#64748b}
  .list-item{padding:10px;background:#fff;border-radius:8px;margin:6px 0;display:flex;justify-content:space-between;align-items:center;box-shadow:0 1px 6px rgba(0,0,0,.05)}
  .color-tag{width:16px;height:16px;border-radius:50%;margin-right:8px}
  .comment{font-size:12px;color:#64748b;margin-top:4px;display:none}
  .list-item:hover .comment{display:block}
</style>
</head><body>

<header>🎵 Musikkontroll</header>

<!-- KONTROLL -->
<div id="kontroll" class="page active">
  <div class="card">
    <label>Org.nr</label>
    <div class="row"><input id="orgnr" maxlength="9"><button class="btn-p" onclick="searchBrreg()">SØK</button></div>
    <div class="log" id="brreg-log"></div>
  </div>

  <div class="card"><label>Besøksnavn</label><input id="navn"></div>
  <div class="card"><label>Adresse</label><input id="besoksadresse"></div>
  <div class="card">
    <label>Post</label>
    <div class="row"><input id="besoks_postnr" placeholder="0000"><input id="besoks_poststed"></div>
  </div>
  <div class="card"><label>Firma</label><input id="firma"></div>
  <div class="card"><label>Type</label><select id="type" onchange="updateTariffDefault()"><option>Serveringssted</option><option>Kundelokale</option></select></div>

  <!-- FAST BUNN-KORT -->
  <div class="fixed-bottom">
    <div id="tariff-section">
      <strong>Tariff</strong>
      <div id="tariff-rows"></div>
      <button class="btn-g" onclick="addRow()">+ Linje</button>
    </div>
    <div class="card" style="margin:8px 0 0">
      <label>Høyttalere</label><input id="hoyttalere">
      <label>Kommentar</label><textarea id="kommentar" rows="2"></textarea>
    </div>
    <button class="btn-p" onclick="save('draft')">Lagre</button>
    <button class="btn-a" onclick="printReceipt()">Print</button>
    <button class="btn-g" onclick="save('sent')">Send PDF</button>
  </div>
</div>

<!-- LISTER – NY DESIGN -->
<div id="lister" class="page">
  <div class="card">
    <label>Ny liste</label>
    <div class="row"><input id="listName" placeholder="Telemark Oktober 25"><button class="btn-p" onclick="newList()">+ Opprett</button></div>
    <input type="file" id="excelFile" accept=".xlsx" onchange="importExcel(event)" style="margin-top:8px">
  </div>
  <div id="lists-dashboard"></div>
</div>

<div id="kontrollert" class="page"><div id="archive"></div></div>

<nav>
  <button class="active" onclick="show('kontroll')">Skjema</button>
  <button onclick="show('lister')">Lister</button>
  <button onclick="show('kontrollert')">Ferdig</button>
</nav>

<script>
  // === DATA ===
  const s = localStorage;
  let lists = JSON.parse(s.getItem('listsV2')||'[]'); // {id,name,date,items[],colors{}}
  let controls = JSON.parse(s.getItem('controls')||'[]');
  let rowId = 0;

  // === NAV ===
  function show(p){
    document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));
    document.getElementById(p).classList.add('active');
    document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
    event.target.classList.add('active');
    if(p==='lister')renderDashboard();
    if(p==='kontrollert')renderArchive();
  }

  // === KONTROLL ===
  async function searchBrreg(){ /* SAMME SOM FØR – uendret */ }
  function updateTariffDefault(){ if(!document.getElementById('tariff-rows').children.length) addRow(); }
  function addRow(data=null){
    const t=document.getElementById('type').value;
    const d=data||{kvm:'',seats:t==='Serveringssted'?'':null,days:t==='Serveringssted'?'356':'310',type:'Bakgrunnsmusikk'};
    const r=document.createElement('div'); r.className='row'; r.style.margin='8px 0';
    r.innerHTML=`
      <input type="number" placeholder="kvm" value="${d.kvm||''}">
      ${t==='Serveringssted'?`<input type="number" placeholder="seter" value="${d.seats||''}">`:''}
      <input type="number" placeholder="dager" value="${d.days||''}">
      <select><option ${d.type==='Bakgrunnsmusikk'?'selected':''}>Bakgrunn</option><option ${d.type==='Fremtredende'?'selected':''}>Fremtredende</option></select>
      <button onclick="this.parentElement.remove()">−</button>
    `;
    document.getElementById('tariff-rows').appendChild(r);
  }
  function getFormData(){ /* SAMME SOM FØR */ }
  function save(status){ /* SAMME SOM FØR */ }

  // === LISTER – NYTT DASHBOARD ===
  function newList(){
    const name=document.getElementById('listName').value||'Ny liste '+new Date().toLocaleDateString();
    const list={id:Date.now(),name,date:new Date().toISOString(),items:[],colors:{}};
    lists.push(list); s.setItem('listsV2',JSON.stringify(lists));
    document.getElementById('listName').value='';
    renderDashboard();
  }
  function importExcel(e){
    const file=e.target.files[0];
    const reader=new FileReader();
    reader.onload=ev=>{
      const wb=XLSX.read(ev.target.result,{type:'array'});
      const activeList=lists[lists.length-1];
      wb.SheetNames.forEach(n=>{
        const json=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1});
        const h=json[0];
        json.slice(1).forEach(row=>{
          let o={color:'white',note:''};
          h.forEach((k,i)=>{ o[h[i]]=row[i]||'' });
          activeList.items.push(o);
        });
      });
      s.setItem('listsV2',JSON.stringify(lists));
      renderDashboard();
    };
    reader.readAsArrayBuffer(file);
  }
  function renderDashboard(){
    const d=document.getElementById('lists-dashboard'); d.innerHTML='';
    lists.sort((a,b)=>b.date.localeCompare(a.date)).forEach(list=>{
      const div=document.createElement('div'); div.className='card';
      div.innerHTML=`
        <div class="list-header">
          <strong>${list.name}</strong>
          <div class="list-meta">Opprettet ${new Date(list.date).toLocaleDateString()} 
            ${list.items.length} steder</div>
        </div>
        <div id="items-${list.id}"></div>
      `;
      d.appendChild(div);
      const container=document.getElementById(`items-${list.id}`);
      list.items.forEach((item,i)=>{
        const colors=['#fff','#10b98133','#f59e0b33','#ef444433'];
        const el=document.createElement('div'); el.className='list-item';
        el.innerHTML=`
          <div>
            <span class="color-tag" style="background:${colors[item.color||0]}"></span>
            <b>${item.Orgnummer||''}</b> ${item.Navn||''}
            <div class="comment">${item.note||''}</div>
          </div>
          <div>
            <select onchange="setColor(${list.id},${i},this.value)">
              <option value="0" ${item.color==0?'selected':''}>⚪</option>
              <option value="1" ${item.color==1?'selected':''}>🟢</option>
              <option value="2" ${item.color==2?'selected':''}>🟡</option>
              <option value="3" ${item.color==3?'selected':''}>🔴</option>
            </select>
            <button onclick="loadItem(${list.id},${i})">Start</button>
          </div>
        `;
        container.appendChild(el);
      });
    });
  }
  function setColor(listId,itemIdx,color){
    const list=lists.find(l=>l.id===listId);
    list.items[itemIdx].color=parseInt(color);
    s.setItem('listsV2',JSON.stringify(lists));
  }
  function loadItem(listId,itemIdx){
    const list=lists.find(l=>l.id===listId);
    const item=list.items[itemIdx];
    document.getElementById('orgnr').value=item.Orgnummer||'';
    searchBrreg();
    show('kontroll');
  }

  // === INIT ===
  if(lists.length===0) newList();
  addRow(); renderDashboard(); renderArchive();
</script>
</body></html>
