<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Musikkontroll</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  :root{--p:#0f172a;--g:#10b981;--a:#f59e0b;--r:#ef4444}
  body{font:-apple-system,sans-serif;margin:0;background:#f8fafc;color:#1e293b}
  header{background:var(--p);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:10;box-shadow:0 2px 10px rgba(0,0,0,.1)}
  nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e2e8f0;display:flex;z-index:20}
  nav button{flex:1;padding:14px;font-weight:600;color:var(--p);background:none;border:none}
  nav button.active{background:var(--p);color:#fff}
  .page{display:none;padding:16px 16px 100px;max-width:640px;margin:auto}
  .page.active{display:block}
  .card{background:#fff;padding:14px;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.08);margin-bottom:12px}
  label{display:block;font-weight:600;margin:8px 0 4px;color:#334155}
  input,select,textarea{width:100%;padding:11px;border:2px solid #e2e8f0;border-radius:10px;font-size:16px;box-sizing:border-box}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  .row>*{flex:1;min-width:80px}
  button{padding:12px;border-radius:10px;font-weight:600;width:100%;margin:6px 0}
  .btn-p{background:var(--p);color:#fff}
  .btn-g{background:var(--g);color:#fff}
  .btn-a{background:var(--a);color:#fff}
  .btn-r{background:var(--r);color:#fff}
  .log{font-size:13px;color:var(--g);background:#f0fdf4;padding:8px;border-radius:8px;margin-top:4px}
  .fixed-bottom{position:fixed;bottom:70px;left:16px;right:16px;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);padding:12px;border-radius:12px;box-shadow:0 -2px 12px rgba(0,0,0,.1);z-index:5}
  .list-card{background:#fff;padding:12px;border-radius:12px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
  .list-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .list-meta{font-size:12px;color:#64748b}
  .list-item{display:flex;align-items:center;padding:10px 0;border-bottom:1px solid #eee}
  .color-dot{width:14px;height:14px;border-radius:50%;margin-right:10px}
  .item-info{flex:1}
  .item-name{font-weight:600;font-size:15px}
  .item-addr{font-size:13px;color:#64748b}
  .item-note{font-size:12px;color:#64748b;margin-top:4px;display:none}
  .list-item:hover .item-note{display:block}
  .actions button{font-size:20px;background:none;border:none;padding:0 8px}
  .nattklubb-toggle{margin:8px 0;padding:10px;background:#fff4e5;border-radius:10px;text-align:center}
</style>
</head>
<body>

<header>🎵 Musikkontroll</header>

<div id="kontroll" class="page active">
  <div class="card">
    <label>Org.nr</label>
    <div class="row"><input id="orgnr" maxlength="9"><button class="btn-p" onclick="searchBrreg()">SØK</button></div>
    <div class="log" id="brreg-log"></div>
  </div>

  <div class="card"><label>Besøksnavn</label><input id="navn"></div>
  <div class="card"><label>Adresse</label><input id="besoksadresse"></div>
  <div class="card">
    <label>Post</label>
    <div class="row"><input id="besoks_postnr" placeholder="0000"><input id="besoks_poststed"></div>
  </div>
  <div class="card"><label>Firma</label><input id="firma"></div>
  <div class="card"><label>Type</label><select id="type" onchange="updateTariffDefault()"><option>Serveringssted</option><option>Kundelokale</option></select></div>

  <div class="fixed-bottom">
    <div class="nattklubb-toggle">
      <label><input type="checkbox" id="nattklubb" onchange="calc()"> Nattklubb lørdag (52 dager)</label>
    </div>
    <strong>Tariff</strong>
    <div id="tariff-rows"></div>
    <button class="btn-g" onclick="addRow()">+ Linje</button>
    <div style="margin-top:12px">
      <label>Høyttalere</label><input id="hoyttalere">
      <label>Kommentar</label><textarea id="kommentar" rows="2"></textarea>
    </div>
    <div class="row" style="margin-top:12px">
      <button class="btn-p" onclick="save('draft')">Lagre</button>
      <button class="btn-a" onclick="printReceipt()">Print</button>
      <button class="btn-g" onclick="save('sent')">Send PDF</button>
    </div>
  </div>
</div>

<div id="lister" class="page">
  <div class="card">
    <div class="row">
      <input id="newListName" placeholder="Ny liste">
      <button class="btn-p" onclick="createList()">Opprett</button>
    </div>
    <input type="file" id="excelFile" accept=".xlsx" onchange="importExcel(event)" style="margin-top:8px">
  </div>
  <div id="lists-container"></div>
</div>

<div id="kontrollert" class="page"><div id="archive"></div></div>

<nav>
  <button class="active" onclick="show('kontroll')">Skjema</button>
  <button onclick="show('lister')">Lister</button>
  <button onclick="show('kontrollert')">Ferdig</button>
</nav>

<script>
  const s = localStorage;
  let lists = JSON.parse(s.getItem('listsV3') || '[]');
  let controls = JSON.parse(s.getItem('controls') || '[]');
  let rowId = 0;

  // === NAV ===
  function show(p){
    document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));
    document.getElementById(p).classList.add('active');
    document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
    event.target.classList.add('active');
    if(p==='lister') renderLists();
    if(p==='kontrollert') renderArchive();
  }

  // === BRREG ===
  async function searchBrreg(){
    const n=document.getElementById('orgnr').value.replace(/\D/g,'');
    if(n.length!==9) return;
    document.getElementById('brreg-log').innerHTML='Søker...';
    try{
      const r=await fetch(`https://data.brreg.no/enhetsregisteret/api/enheter/${n}`);
      if(!r.ok) throw '';
      const d=await r.json();
      const a=d.forretningsadresse||d.beliggenhetsadresse||{};
      if(!document.getElementById('navn').value) document.getElementById('navn').value=d.navn||'';
      if(!document.getElementById('besoksadresse').value) document.getElementById('besoksadresse').value=a.adresse?.join(', ')||'';
      document.getElementById('besoks_postnr').value=a.postnummer||'';
      document.getElementById('besoks_poststed').value=a.poststed||'';
      document.getElementById('firma').value=d.navn||'';
      const k=(d.naeringskode1?.kode||'').slice(0,2);
      const t= k==='56'?'Serveringssted':(k==='47'||k==='96'?'Kundelokale':'Serveringssted');
      document.getElementById('type').value=t;
      document.getElementById('brreg-log').innerHTML='Hentet!';
      updateTariffDefault();
    }catch{
      document.getElementById('brreg-log').innerHTML='Ikke funnet';
    }
  }

  // === TARIFF ===
  function updateTariffDefault(){
    if(document.getElementById('tariff-rows').children.length===0) addRow();
  }
  function addRow(){
    const r=document.createElement('div'); r.className='row'; r.style.margin='8px 0';
    r.innerHTML=`
      <input type="number" placeholder="kvm" value="">
      ${document.getElementById('type').value==='Serveringssted'?`<input type="number" placeholder="seter" value="">`:''}
      <input type="number" placeholder="dager/uke" value="6">
      <button onclick="this.parentElement.remove()">−</button>
    `;
    document.getElementById('tariff-rows').appendChild(r);
  }

  // === KALKULATOR ===
  const gramoNormalDag = [10.26,19.69,29.12,38.55,47.98,57.41,66.84,76.27];
  const gramoNattDag = [102.72,171.21,239.7,308.17,376.67,462.25,547.86,633.6];
  const tonoMnd = [701,1045,1573,1847,2454,2781];
  const tonoNattDag = [77,111,173,228,337,453];

  function getIndex(val, arr){
    if(val<=50) return 0;
    if(val<=100) return 1;
    if(val<=150) return 2;
    if(val<=200) return 3;
    if(val<=300) return 4;
    return 5;
  }

  function calc(){
    let kvm=0, seter=0, dagerUke=0;
    document.querySelectorAll('#tariff-rows .row').forEach(r=>{
      const i=r.querySelectorAll('input');
      kvm += +i[0].value||0;
      if(document.getElementById('type').value==='Serveringssted') seter += +i[1].value||0;
      dagerUke += +i[i.length-2].value||0;
    });
    const normalDager = dagerUke * 52;
    const nattDager = document.getElementById('nattklubb').checked ? 52 : 0;

    const k = getIndex(kvm, gramoNormalDag);
    const s = getIndex(seter, tonoMnd);

    const gramo = gramoNormalDag[k] * normalDager + gramoNattDag[k] * nattDager;
    const tono = tonoMnd[s] * 12 + tonoNattDag[s] * nattDager;

    document.getElementById('sum').innerHTML = 
      `Gramo: ${gramo.toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g,' ')} kr | `+
      `TONO: ${tono.toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g,' ')} kr | `+
      `TOTAL ÅR: ${(gramo+tono).toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g,' ')} kr`;
  }
  document.getElementById('tariff-rows').addEventListener('input',calc);
  document.getElementById('nattklubb').addEventListener('change',calc);

  // === LISTER ===
  function createList(){
    const name = document.getElementById('newListName').value.trim() || 'Liste '+new Date().toLocaleDateString();
    lists.push({id:Date.now(), name, date:new Date().toISOString(), items:[]});
    s.setItem('listsV3', JSON.stringify(lists));
    document.getElementById('newListName').value='';
    renderLists();
  }

  function deleteList(id){
    if(confirm('Slette '+lists.find(l=>l.id===id).name+'?')) {
      lists = lists.filter(l=>l.id!==id);
      s.setItem('listsV3', JSON.stringify(lists));
      renderLists();
    }
  }

  function importExcel(e){
    const file = e.target.files[0];
    const reader = new FileReader();
    reader.onload = ev=>{
      const wb = XLSX.read(ev.target.result, {type:'array'});
      const list = lists[lists.length-1];
      wb.SheetNames.forEach(n=>{
        const json = XLSX.utils.sheet_to_json(wb.Sheets[n], {header:1});
        const h = json[0];
        json.slice(1).forEach(row=>{
          let o = {note:'', color:0};
          h.forEach((k,i)=> o[k]=row[i]||'');
          list.items.push(o);
        });
      });
      s.setItem('listsV3', JSON.stringify(lists));
      renderLists();
    };
    reader.readAsArrayBuffer(file);
  }

  function renderLists(){
    const c = document.getElementById('lists-container'); c.innerHTML='';
    lists.sort((a,b)=>b.date.localeCompare(a.date)).forEach(list=>{
      const div = document.createElement('div'); div.className='list-card';
      div.innerHTML = `
        <div class="list-header">
          <strong>${list.name}</strong>
          <button class="btn-r" style="width:auto;padding:6px 12px" onclick="deleteList(${list.id})">Slett</button>
        </div>
        <div class="list-meta">Opprettet ${new Date(list.date).toLocaleDateString()} – ${list.items.length} steder</div>
        <div id="items-${list.id}"></div>
      `;
      c.appendChild(div);
      const container = document.getElementById(`items-${list.id}`);
      list.items.forEach((item,i)=>{
        const colors = ['#fff','#10b981','#f59e0b','#ef4444'];
        const el = document.createElement('div'); el.className='list-item';
        el.innerHTML = `
          <div class="color-dot" style="background:${colors[item.color]}"></div>
          <div class="item-info">
            <div class="item-name">${item.Orgnummer||''} ${item.Navn||''}</div>
            <div class="item-addr">${item.Besøksadresse||''} ${item.Postnr||''} ${item.Poststed||''}</div>
            <div class="item-note" contenteditable="true" onblur="lists.find(l=>l.id===${list.id}).items[${i}].note=this.innerText;s.setItem('listsV3',JSON.stringify(lists))">${item.note||'Trykk for notat'}</div>
          </div>
          <div class="actions">
            <select onchange="lists.find(l=>l.id===${list.id}).items[${i}].color=this.value;s.setItem('listsV3',JSON.stringify(lists));renderLists()">
              <option value="0" ${item.color==0?'selected':''}>⚪</option>
              <option value="1" ${item.color==1?'selected':''}>🟢</option>
              <option value="2" ${item.color==2?'selected':''}>🟡</option>
              <option value="3" ${item.color==3?'selected':''}>🔴</option>
            </select>
            <button onclick="loadFromList(${list.id},${i})">Start</button>
          </div>
        `;
        container.appendChild(el);
      });
    });
  }

  function loadFromList(listId, idx){
    const list = lists.find(l=>l.id===listId);
    const item = list.items[idx];
    document.getElementById('orgnr').value = item.Orgnummer||'';
    document.getElementById('navn').value = item.Navn||'';
    document.getElementById('besoksadresse').value = item.Besøksadresse||'';
    document.getElementById('besoks_postnr').value = item.Postnr||'';
    document.getElementById('besoks_poststed').value = item.Poststed||'';
    show('kontroll');
    searchBrreg(); // fyller resten
  }

  // === INIT ===
  if(lists.length===0) createList();
  addRow(); renderLists(); renderArchive(); calc();
</script>
</body>
</html>
