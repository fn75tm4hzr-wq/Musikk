<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Musikkontroll</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="https://tono.no/fonts/soehne.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    :root { --tono-blue: #0055ff; --tono-gray: #f8f8f8; --tono-text: #000000; }
    body { font-family: 'Söhne', sans-serif; margin: 0; background: var(--tono-gray); color: var(--tono-text); padding-bottom: 300px; } /* Increased padding to avoid overlap */
    header { background: #fff; color: var(--tono-blue); padding: 16px; text-align: center; font-size: 20px; font-weight: 700; }
    nav { position: fixed; bottom: 10px; left: 0; right: 0; background: #fff; border-top: 2px solid #ddd; display: flex; z-index: 10; padding-bottom: 10px; } /* Raised nav by 10px, added padding-bottom for easier tap */
    nav button { flex: 1; padding: 16px; background: none; font-weight: 600; color: var(--tono-blue); border: none; font-size: 16px; }
    nav button.active { color: #fff; background: var(--tono-blue); }
    .page { display: none; padding: 20px; max-width: 640px; margin: 0 auto; }
    .page.active { display: block; }
    .card { background: #fff; padding: 16px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); margin-bottom: 16px; }
    label { font-weight: 600; color: #333; margin: 12px 0 4px; display: block; }
    input, select, textarea { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 8px; font-size: 16px; box-sizing: border-box; }
    button { background: var(--tono-blue); color: #fff; border: none; padding: 16px; border-radius: 8px; font-size: 16px; font-weight: 600; margin: 8px 0; width: 100%; }
    .btn-green { background: #10b981; }
    .btn-amber { background: #f59e0b; }
    .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin: 8px 0; }
    .row > * { flex: 1; min-width: 100px; }
    .row button { width: 44px; height: 44px; font-size: 22px; background: #ddd; color: var(--tono-blue); }
    .log { font-size: 14px; color: #10b981; margin-top: 4px; padding: 8px; background: #f0fdf4; border-radius: 8px; }
    .fixed-bottom { position: fixed; bottom: 60px; left: 16px; right: 16px; background: #fff; padding: 16px; border-radius: 12px; box-shadow: 0 -4px 20px rgba(0,0,0,0.08); z-index: 9; } /* Bottom 60px to avoid swipe conflict */
  </style>
</head>
<body>

<header>🎵 Musikkontroll</header>

<div id="kontroll" class="page active">
  <div class="card">
    <label>Org.nr</label>
    <div class="row"><input id="orgnr" maxlength="9"><button onclick="searchBrreg()">SØK</button></div>
    <div class="log" id="brreg-log"></div>
  </div>

  <div class="card"><label>Besøksnavn</label><input id="navn"></div>
  <div class="card"><label>Adresse</label><input id="besoksadresse"></div>
  <div class="card">
    <label>Post</label>
    <div class="row"><input id="besoks_postnr"><input id="besoks_poststed"></div>
  </div>
  <div class="card"><label>Firma</label><input id="firma"></div>
  <div class="card"><label>Type</label><select id="type" onchange="updateTariffDefault()"><option>Serveringssted</option><option>Kundelokale</option></select></div>

  <div class="fixed-bottom">
    <strong>Tariff</strong>
    <div id="tariff-rows"></div>
    <button class="btn-green" onclick="addRow()">+ Linje</button>
    <label>Høyttalere</label><input id="hoyttalere">
    <label>Kommentar</label><textarea id="kommentar" rows="2"></textarea>
    <div class="row" style="margin-top:12px">
      <button>Lagre</button>
      <button class="btn-amber">Print</button>
      <button class="btn-green">Send PDF</button>
    </div>
  </div>
</div>

<div id="lister" class="page">
  <div class="card">
    <div class="row">
      <input id="newListName" placeholder="Ny liste">
      <button onclick="createList()">Opprett</button>
    </div>
    <input type="file" id="excelFile" accept=".xlsx" onchange="importExcel(event)" style="margin-top:8px">
  </div>
  <div id="lists-container"></div>
</div>

<div id="kontrollert" class="page"><div id="archive"></div></div>

<nav>
  <button class="active" onclick="show('kontroll')">Skjema</button>
  <button onclick="show('lister')">Lister</button>
  <button onclick="show('kontrollert')">Ferdig</button>
</nav>

<script>
  // Din JS-kode fra siste versjon – kopier og lim inn her
</script>
</body>
</html>
