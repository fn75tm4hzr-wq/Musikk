<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Musikkontroll</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  body{font:-apple-system,sans-serif;margin:0;background:#f8fafc;color:#1e293b;padding-bottom:140px}
  header{background:#0f172a;color:#fff;padding:12px;text-align:center;font-size:20px;font-weight:700}
  nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:2px solid #e2e8f0;display:flex;z-index:10}
  nav button{flex:1;padding:16px;background:none;font-weight:600;color:#0f172a;border:none;font-size:16px}
  nav button.active{background:#0f172a;color:#fff}
  .page{display:none;padding:12px;max-width:640px;margin:auto}
  .page.active{display:block}
  .card{background:#fff;padding:8px;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.08);margin-bottom:4px}
  label{font-weight:600;color:#334155;margin:4px 0 2px;display:block;font-size:14px}
  input,select,textarea{width:100%;padding:9px;border:2px solid #e2e8f0;border-radius:10px;font-size:16px;box-sizing:border-box}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:4px 0}
  .row>*{flex:1;min-width:80px}
  .row button{width:36px;height:36px;font-size:18px;background:#e2e8f0;color:#0f172a;border:none;border-radius:8px}
  button{display:flex;align-items:center;justify-content:center;background:#0f172a;color:#fff;border:none;padding:12px;border-radius:10px;font-size:16px;font-weight:600;margin:4px 0;width:100%}
  .btn-green{background:#10b981}
  .btn-amber{background:#f59e0b}
  .btn-reset{background:#6b7280;margin-top:4px}
  .log{font-size:13px;color:#10b981;background:#f0fdf4;padding:6px;border-radius:8px;margin-top:2px}
  .list-header{font-weight:600;display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .list-table{width:100%;border-collapse:collapse;margin-top:8px}
  .list-table th{background:#f1f5f9;padding:8px;text-align:left;font-weight:600;font-size:14px;cursor:pointer}
  .list-table td{padding:8px;vertical-align:top;border-bottom:1px solid #e2e8f0}
  .list-row{cursor:grab}
  .list-row:active{cursor:grabbing}
  .list-row.green{background:#ecfdf5}
  .list-row.yellow{background:#fefce8}
  .list-row.red{background:#fee2e2}
  .map-btn{background:#0066cc;color:white;padding:4px 8px;border-radius:50%;font-size:12px}
  .action-btns{display:flex;gap:4px}
  .action-btns button{width:36px;height:36px;padding:0}
  .month-header{background:#f1f5f9;padding:12px;border-radius:12px;margin:12px 0;font-weight:600}
  .archive-item{background:white;padding:12px;margin:8px 0;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,0.05)}
</style>
</head>
<body>

<header>🎵 Musikkontroll</header>

<div id="kontroll" class="page active">
  <div class="card">
    <label>Org.nr</label>
    <div class="row"><input id="orgnr" maxlength="9"><button onclick="searchBrreg()">SØK</button></div>
    <button class="btn-reset" onclick="resetForm()">🗑 Nullstill skjema</button>
    <div class="log" id="brreg-log"></div>
  </div>

  <div class="card"><label>Besøksnavn</label><input id="navn"></div>
  <div class="card"><label>Adresse</label><input id="besoksadresse"></div>
  <div class="card">
    <label>Post</label>
    <div class="row"><input id="besoks_postnr"><input id="besoks_poststed"></div>
  </div>
  <div class="card"><label>Firma</label><input id="firma"></div>
  <div class="card"><label>Type</label><select id="type" onchange="updateTariffDefault()"><option>Serveringssted</option><option>Kundelokale</option></select></div>

  <div class="card">
    <strong>Størrelse</strong>
    <div id="tariff-rows"></div>
    <button class="btn-green" onclick="addRow()">+ Ny linje</button>
    <label>Høyttalere</label><input id="hoyttalere">
    <label>Kommentar</label><textarea id="kommentar" rows="2"></textarea>
    <div class="row">
      <button onclick="save('draft')">Lagre</button>
      <button class="btn-amber" onclick="printReceipt()">Print</button>
      <button class="btn-green" onclick="save('sent')">Send PDF</button>
    </div>
  </div>
</div>

<!-- ============================== LISTER ============================== -->
<div id="lister" class="page">
  <div class="card">
    <input type="file" id="excelFile" accept=".xlsx" onchange="importExcel(event)" style="margin-bottom:8px">
  </div>
  <div id="lists-dashboard"></div>
</div>
<!-- ================================================================= -->

<div id="kontrollert" class="page"><div id="archive"></div></div>

<nav>
  <button class="active" onclick="show('kontroll')">Skjema</button>
  <button onclick="show('lister')">Lister</button>
  <button onclick="show('kontrollert')">Kontrollert</button>
</nav>

<script>
  const s = localStorage;
  let lists = JSON.parse(s.getItem('lists') || '[]');
  let controls = JSON.parse(s.getItem('controls') || '[]');

  function show(p){
    document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));
    document.getElementById(p).classList.add('active');
    document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
    event.target.classList.add('active');
    if(p==='lister') renderDashboard();
    if(p==='kontrollert') renderArchive();
  }

  async function searchBrreg(){
    const n=document.getElementById('orgnr').value.replace(/\D/g,'');
    if(n.length!==9) return;
    document.getElementById('brreg-log').innerHTML='Søker...';
    try{
      const r=await fetch(`https://data.brreg.no/enhetsregisteret/api/enheter/${n}`);
      if(!r.ok) throw '';
      const d=await r.json();
      const a=d.forretningsadresse||d.beliggenhetsadresse||{};
      document.getElementById('besoks_postnr').value=a.postnummer||'';
      document.getElementById('besoks_poststed').value=a.poststed||'';
      document.getElementById('firma').value=d.navn||'';
      const k=(d.naeringskode1?.kode||'').slice(0,2);
      const t= k==='56'?'Serveringssted':(k==='47'||k==='96'?'Kundelokale':'Serveringssted');
      document.getElementById('type').value=t;
      document.getElementById('brreg-log').innerHTML='Hentet postadresse!';
      updateTariffDefault();
    }catch{
      document.getElementById('brreg-log').innerHTML='Ikke funnet';
    }
  }

  function updateTariffDefault(){
    document.getElementById('tariff-rows').innerHTML='';
    addRow();
  }

  function addRow(){
    const type=document.getElementById('type').value;
    const r=document.createElement('div'); r.className='row';
    r.innerHTML=`
      <input type="number" placeholder="Størrelse (kvm)">
      ${type==='Serveringssted'?`<input type="number" placeholder="Sitteplasser">`:''}
      <input type="number" placeholder="Dager pr. uke" value="6">
      <select>
        <option>Bakgrunn</option>
        <option>Fremtredende</option>
      </select>
      <button onclick="this.parentElement.remove()">−</button>
    `;
    document.getElementById('tariff-rows').appendChild(r);
  }

  function resetForm(){
    if(confirm('Nullstille hele skjemaet?')) {
      document.getElementById('orgnr').value='';
      document.getElementById('navn').value='';
      document.getElementById('besoksadresse').value='';
      document.getElementById('besoks_postnr').value='';
      document.getElementById('besoks_poststed').value='';
      document.getElementById('firma').value='';
      document.getElementById('type').value='Serveringssted';
      document.getElementById('hoyttalere').value='';
      document.getElementById('kommentar').value='';
      document.getElementById('tariff-rows').innerHTML='';
      document.getElementById('brreg-log').innerHTML='';
      addRow();
    }
  }

  function getFormData(){
    const rows=[];
    document.querySelectorAll('#tariff-rows .row').forEach(r=>{
      const i=r.querySelectorAll('input,select');
      const isServ=document.getElementById('type').value==='Serveringssted';
      rows.push({
        kvm:i[0].value,
        seter:isServ?i[1].value:'',
        dager:i[isServ?2:1].value,
        type:i[isServ?3:2].value
      });
    });
    return {
      orgnr:document.getElementById('orgnr').value,
      navn:document.getElementById('navn').value,
      adresse:document.getElementById('besoksadresse').value,
      postnr:document.getElementById('besoks_postnr').value,
      poststed:document.getElementById('besoks_poststed').value,
      firma:document.getElementById('firma').value,
      type:document.getElementById('type').value,
      tariff:rows,
      hoyttalere:document.getElementById('hoyttalere').value,
      kommentar:document.getElementById('kommentar').value,
      dato:new Date().toISOString()
    };
  }

  function save(status){
    const data=getFormData();
    data.status=status;
    controls.push(data);
    s.setItem('controls',JSON.stringify(controls));
    alert(status==='sent'?'Sendt! PDF lastet ned.':'Lagret!');
    if(status==='sent') {
      generatePDF(data);
      // Fjern fra Lister hvis den kom derfra
      const currentList = lists.find(l => l.items.some(it => it.Orgnummer === data.orgnr));
      if(currentList) {
        currentList.items = currentList.items.filter(it => it.Orgnummer !== data.orgnr);
        s.setItem('lists',JSON.stringify(lists));
        renderDashboard();
      }
      renderArchive();
    }
  }

  function generatePDF(data){
    const {jsPDF}=window.jspdf;
    const doc=new jsPDF();
    let y=20;
    doc.setFontSize(16); doc.text('MUSIKKONTROLL',105,y,{align:'center'}); y+=10;
    doc.setFontSize(12);
    doc.text(`Org.nr: ${data.orgnr}`,20,y); y+=8;
    doc.text(`Navn: ${data.navn}`,20,y); y+=8;
    doc.text(`Adresse: ${data.adresse}`,20,y); y+=8;
    doc.text(`Post: ${data.postnr} ${data.poststed}`,20,y); y+=8;
    data.tariff.forEach((t,i)=>{
      doc.text(`${i+1}. ${t.type}: ${t.kvm} kvm${t.seter?`, ${t.seter} seter`:''}, ${t.dager} dager`,25,y); y+=8;
    });
    doc.text(`Høyttalere: ${data.hoyttalere}`,20,y); y+=8;
    doc.text(`Kommentar: ${data.kommentar}`,20,y);
    const blob=doc.output('blob');
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url; a.download=`kontroll-${data.orgnr}.pdf`; a.click();
    alert('PDF lastet ned! Send manuelt til kjartan.lode@tono.no');
  }

  function printReceipt(){
    const data=getFormData();
    const text=`KONTROLL\n${data.navn}\n${data.orgnr}\n${data.tariff.map(t=>`${t.type}: ${t.kvm}kvm/${t.dager}d`).join('\n')}\n${data.kommentar}`;
    const win=window.open('','','width=300,height=500');
    win.document.write('<pre style="font:14px monospace">'+text+'</pre>');
    win.print();
  }

  // === LISTER – 100 % DIN ===
  function importExcel(e){
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      const data = new Uint8Array(ev.target.result);
      const wb = XLSX.read(data, { type: 'array' });
      const name = file.name.replace('.xlsx','').replace('.xls','');
      const L = {id:Date.now(), name, date:new Date().toISOString(), items:[]};
      wb.SheetNames.forEach(sheet => {
        const ws = wb.Sheets[sheet];
        const json = XLSX.utils.sheet_to_json(ws, { header: 1 });
        const headers = json[0];
        json.slice(1).forEach(row => {
          const obj = {};
          headers.forEach((h,i) => obj[h] = row[i] || '');
          L.items.push({
            Orgnummer: obj['B'] || '',
            Navn: obj['C'] || '',
            Gateadresse: obj['D'] || '',
            Postnr: obj['E'] || '',
            Poststed: obj['F'] || '',
            Kommentar: obj['A'] || '',
            color:0
          });
        });
      });
      lists.push(L);
      s.setItem('lists',JSON.stringify(lists));
      renderDashboard();
    };
    reader.readAsArrayBuffer(file);
  }

  function editListName(id){
    const L = lists.find(l=>l.id===id);
    const newName = prompt('Nytt navn på listen', L.name);
    if(newName) {
      L.name = newName;
      s.setItem('lists',JSON.stringify(lists));
      renderDashboard();
    }
  }

  function deleteList(id){
    if(confirm('Slette hele listen?')) {
      lists = lists.filter(l=>l.id!==id);
      s.setItem('lists',JSON.stringify(lists));
      renderDashboard();
    }
  }

  function sortList(listId, col){
    const L = lists.find(l=>l.id===listId);
    const key = ['Orgnummer','Navn','Gateadresse','Postnr','Poststed','Kommentar'][col];
    L.items.sort((a,b)=> (a[key]||'').localeCompare(b[key]||''));
    s.setItem('lists',JSON.stringify(lists));
    renderDashboard();
  }

  function openMap(addr){
    if(!addr) return;
    const q=encodeURIComponent(addr);
    window.open(`https://maps.apple.com/?q=${q}`,'_blank');
  }

  function moveItem(listId, idx, dir){
    const L = lists.find(l=>l.id===listId);
    const newIdx = idx + dir;
    if(newIdx < 0 || newIdx >= L.items.length) return;
    [L.items[idx], L.items[newIdx]] = [L.items[newIdx], L.items[idx]];
    s.setItem('lists',JSON.stringify(lists));
    renderDashboard();
  }

  function renderDashboard(){
    const d=document.getElementById('lists-dashboard'); d.innerHTML='';
    lists.sort((a,b)=>b.date.localeCompare(a.date)).forEach(L=>{
      const box=document.createElement('div'); box.className='card';
      box.innerHTML=`
        <div class="list-header">
          <span onclick="editListName(${L.id})" style="cursor:pointer">${L.name}</span>
          <small>${new Date(L.date).toLocaleDateString()}</small>
          <button class="btn-r" style="padding:4px 8px" onclick="deleteList(${L.id})">🗑</button>
        </div>
        <table class="list-table">
          <thead>
            <tr>
              <th onclick="sortList(${L.id},0)">Orgnummer</th>
              <th onclick="sortList(${L.id},1)">Besøksnavn</th>
              <th onclick="sortList(${L.id},2)">Gateadresse</th>
              <th onclick="sortList(${L.id},3)">Post</th>
              <th onclick="sortList(${L.id},5)">Kommentar</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="tbody-${L.id}"></tbody>
        </table>
      `;
      d.appendChild(box);
      const tbody=document.getElementById(`tbody-${L.id}`);
      L.items.forEach((it,i)=>{
        const colors=['','#ecfdf5','#fefce8','#fee2e2'];
        const tr=document.createElement('tr'); tr.className='list-row';
        tr.style.background=colors[it.color||0];
        tr.draggable=true;
        tr.ondragstart=e=>e.dataTransfer.setData('text',i);
        tr.ondragover=e=>e.preventDefault();
        tr.ondrop=e=>{
          e.preventDefault();
          const from=parseInt(e.dataTransfer.getData('text'));
          if(from!==i) moveItem(L.id,from,i>from?i-1:i);
        };
        tr.innerHTML=`
          <td>${it.Orgnummer||''}</td>
          <td><strong>${it.Navn||''}</strong></td>
          <td>
            <div style="display:flex;align-items:center;gap:4px">
              <span>${it.Gateadresse||''}</span>
              <button class="map-btn" onclick="openMap('${it.Gateadresse} ${it.Postnr} ${it.Poststed}')">🗺️</button>
            </div>
          </td>
          <td>${it.Postnr||''} ${it.Poststed||''}</td>
          <td contenteditable onblur="L.items[${i}].Kommentar=this.innerText;s.setItem('lists',JSON.stringify(lists))">
            ${it.Kommentar||'Trykk for notat'}
          </td>
          <td class="action-btns">
            <button onclick="loadFromList(${L.id},${i})">KONTROLL</button>
            <button onclick="moveItem(${L.id},${i},-1)">↑</button>
            <button onclick="moveItem(${L.id},${i},1)">↓</button>
            <button onclick="deleteItem(${L.id},${i})" class="btn-r">−</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    });
  }

  function loadFromList(listId, idx){
    const L = lists.find(l=>l.id===listId);
    const item = L.items[idx];
    document.getElementById('orgnr').value = item.Orgnummer||'';
    document.getElementById('navn').value = item.Navn||'';
    document.getElementById('besoksadresse').value = item.Gateadresse||'';
    document.getElementById('besoks_postnr').value = item.Postnr||'';
    document.getElementById('besoks_poststed').value = item.Poststed||'';
    show('kontroll');
    searchBrreg();
  }

  function deleteItem(listId, idx){
    if(confirm('Slette denne raden?')) {
      const L = lists.find(l=>l.id===listId);
      L.items.splice(idx,1);
      s.setItem('lists',JSON.stringify(lists));
      renderDashboard();
    }
  }

  function renderArchive(){
    const div = document.getElementById('archive');
    div.innerHTML = '';
    const byMonth = {};
    controls.forEach(c => {
      const m = new Date(c.dato).toLocaleDateString('nb-NO', { year: 'numeric', month: 'long' });
      byMonth[m] = byMonth[m] || [];
      byMonth[m].push(c);
    });
    Object.keys(byMonth).sort().reverse().forEach(month => {
      const el = document.createElement('div');
      el.className = 'month-header';
      el.textContent = month;
      div.appendChild(el);
      byMonth[month].forEach(c => {
        const li = document.createElement('div');
        li.className = 'archive-item';
        const frem = c.tariff.find(t => t.type === 'Fremtredende');
        li.innerHTML = `<b>${c.navn}</b> – ${new Date(c.dato).toLocaleDateString('nb-NO')}<br>
          ${c.tariff.map(t => `${t.kvm} kvm • ${t.seter} seter • ${t.dager} dager • ${t.type}`).join('<br>')}
          ${frem ? '<br>🎤 Fremtredende' : ''}
          <button onclick="editControl('${c.dato}')" style="float:right;background:#f97316;color:white;padding:6px 10px;border-radius:8px">Rediger</button>`;
        div.appendChild(li);
      });
    });
  }

  window.editControl = function(date) {
    const c = controls.find(x => x.dato === date);
    document.getElementById('orgnr').value = c.orgnr;
    document.getElementById('navn').value = c.navn;
    document.getElementById('besoksadresse').value = c.adresse;
    document.getElementById('besoks_postnr').value = c.postnr;
    document.getElementById('besoks_poststed').value = c.poststed;
    document.getElementById('firma').value = c.firma;
    document.getElementById('type').value = c.type;
    document.getElementById('hoyttalere').value = c.hoyttalere;
    document.getElementById('kommentar').value = c.kommentar;
    document.getElementById('tariff-rows').innerHTML = '';
    c.tariff.forEach(t => addRow(t));
    show('kontroll');
  };

  // INIT
  addRow();
  renderDashboard();
  renderArchive();
</script>
</body>
</html>
